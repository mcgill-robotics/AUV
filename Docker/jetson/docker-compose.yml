services:
  douglas:
    image: "mcgillrobotics/auv_2026:${TAG:-latest-jetson}"
    runtime: nvidia
    privileged: true
    network_mode: host
    ipc: host
    pid: host
    environment:
      - ROS_DOMAIN_ID=0
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - UDEV=on
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # X11 display
      - /tmp/.X11-unix/:/tmp/.X11-unix
      # ZED SDK calibration and resources
      - /usr/local/zed/settings/:/usr/local/zed/settings/
      - /usr/local/zed/resources/:/usr/local/zed/resources/
      # Video devices and shared memory
      - /dev:/dev
      - /dev/shm:/dev/shm
      # Optional: GMSL2 camera support
      - /tmp:/tmp
      - /var/nvidia/nvcam/settings/:/var/nvidia/nvcam/settings/
      - /etc/systemd/system/zed_x_daemon.service:/etc/systemd/system/zed_x_daemon.service
      - type: bind
        source: ../../
        target: /home/douglas/AUV
    command: bash -c ${OVERRIDE_COMMAND:-"tail -f /dev/null"}
    build:
      context: ../../
      dockerfile: Docker/jetson/Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    stdin_open: true
    tty: true
    ports:
      - "8765:8765"
