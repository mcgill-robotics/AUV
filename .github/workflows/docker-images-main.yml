name: Docker Images CI

on:
  # Publish to DockerHub on merges to main
  push:
    branches: [ "main", "pooltest/*", "dev/*" ]
  pull_request:
    branches: [ "main", "pooltest/*" ]
    
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Docker Tag (e.g., 2026-01 or dev)'
        required: true
        default: 'dev'
      allow_overwrite:
        description: 'Overwrite existing tag if found?'
        type: boolean
        default: false

  # Run twice daily to catch upstream dependency breakage
  # (base image updates, apt packages, pip packages) without
  # any changes to our repository.
  schedule:
    - cron: '0 0,12 * * *'

jobs:
  build-and-push:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86
            runner: ubuntu-22.04
            context: .
            file: Docker/dev/Dockerfile
            platform: linux/amd64
            suffix: amd64
          - name: nvidia
            runner: ubuntu-22.04
            context: .
            file: Docker/dev/Dockerfile.nvidia
            platform: linux/amd64
            suffix: nvidia-amd64
          - name: arm
            runner: ubuntu-22.04-arm
            context: .
            file: Docker/dev/Dockerfile
            platform: linux/arm64
            suffix: arm64
          - name: jetson
            runner: ubuntu-22.04-arm
            context: .
            file: Docker/jetson/Dockerfile
            platform: linux/arm64
            suffix: jetson

    permissions:
      contents: read
      packages: write
      actions: read
      pull-requests: write

    steps:
      - name: Collect Workflow Telemetry
        uses: ycfreeman/workflow-telemetry-action@v3.0.2
        with:
          job_summary: true
          comment_on_pr: false
          theme: light
          proc_trace_chart_show: false
          proc_trace_table_show: false

      - name: Checkout
        # Using actions/checkout@v6 explicitly to ensure updated Node/npm environment and eliminate associated CI/CD deprecation warnings.
        uses: actions/checkout@v6
        with:
          fetch-tags: true
          submodules: recursive
          lfs: true
      
      - name: Add Swapfile
        uses: ./.github/actions/swapfile

      - name: Clean up Disk Space
        uses: ./.github/actions/cleanup_disk

      - name: Set Docker Tags
        id: docker_tags
        run: |
          # 1. Determine the base tag
          # If manual input exists, use it. Otherwise, use branch name slug.
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          else
            # Extract branch name and slugify it (replace / with -)
            BRANCH_NAME="${{ github.ref_name }}"
            TAG_NAME="${BRANCH_NAME//\//-}"
          fi
          
          # 2. Define the image name
          IMAGE="mcgillrobotics/auv_2026"
          
          # 3. Create the primary tag string
          PRIMARY_TAG="$IMAGE:$TAG_NAME-${{ matrix.suffix }}"
          
          # 4. Create the list of tags to push
          # For main branch, we only use 'latest'. For others, we use the branch/manual tag.
          if [[ "${{ github.ref }}" == "refs/heads/main" && "${{ github.event_name }}" == "push" ]]; then
            TAGS="$IMAGE:latest-${{ matrix.suffix }}"
          else
            TAGS="$PRIMARY_TAG"
          fi
          
          echo "PRIMARY_TAG=$PRIMARY_TAG" >> $GITHUB_ENV
          echo "DOCKER_TAGS=$TAGS" >> $GITHUB_ENV

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check if Tag Exists
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          FULL_TAG="${{ env.PRIMARY_TAG }}"
          ALLOW_OVERWRITE="${{ github.event.inputs.allow_overwrite }}"
          
          # Check if tag exists on Docker Hub
          # Note: This check only validates the PRIMARY tag to avoid accidental overwrite of explicit version.
          # We generally don't check 'latest' here as it is intended to move.
          if docker manifest inspect "$FULL_TAG" > /dev/null 2>&1; then
            if [ "$ALLOW_OVERWRITE" = "true" ]; then
              echo "::warning::Tag '$FULL_TAG' already exists. Overwrite is ENABLED. Proceeding with building."
            else
              echo "::error::Tag '$FULL_TAG' already exists and 'allow_overwrite' is set to false. Aborting to prevent accidental overwrite."
              exit 1
            fi
          else
            echo "Tag '$FULL_TAG' does not exist. Proceeding with building."
          fi

      # Note: Buildx is intentionally not enabled here.
      # The GHA cache backend consumes several GB per platform and
      # exhausts the free plan's 10GB cache quota very quickly.
      # - name: Set up Docker Buildx
      #   uses: docker/setup-buildx-action@v3

      - name: Build and Load image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          load: true   # Load into local Docker daemon for verification below
          push: false
          tags: ${{ env.PRIMARY_TAG }}
          build-args: |
            CI=true
      
      - name: Verify Build
        run: |
          docker run --rm \
            --user $(id -u):$(id -g) \
            -v ${{ github.workspace }}:/home/douglas/AUV \
            ${{ env.PRIMARY_TAG }} \
            /bin/bash -c "./build.sh -d"

      - name: Verify Python library imports and permissions
        run: |
          docker run --rm --user $(id -u):$(id -g) ${{ env.PRIMARY_TAG }} python3 -c "
          import cv2, torch, torchvision, ultralytics, pandas, scipy, albumentations, sys, re
          print('All key Python libraries imported successfully as non-root user.')

          matrix_suffix = '${{ matrix.suffix }}'
          if matrix_suffix in ['nvidia-amd64', 'jetson']:
              build_info = cv2.getBuildInformation()
              print('--- OpenCV Build Information ---')
              print(build_info)
              print('--------------------------------')
              if not re.search(r'NVIDIA CUDA:\s+YES', build_info):
                  sys.exit('ERROR: OpenCV is NOT CUDA enabled.')
              else:
                  print('SUCCESS: OpenCV is CUDA enabled.')
                  
              print('--- PyTorch Build Information ---')
              print('Torch Version:', torch.__version__)
              print('Torch CUDA Version:', torch.version.cuda)
              if torch.version.cuda is None:
                  sys.exit('ERROR: PyTorch is NOT CUDA enabled (torch.version.cuda is None).')
              else:
                  print('SUCCESS: PyTorch is built with CUDA support (' + torch.version.cuda + ').')
          else:
              print('CPU container, skipping CUDA check.')
          "

      # Rebuild from scratch to push — necessary because 'load: true'
      # above is incompatible with a direct push in the same step.
      # Buildx would solve this but is disabled due to cache disk constraints.
      - name: Push verified image to DockerHub
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.DOCKER_TAGS }}
