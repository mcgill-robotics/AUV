# Global/common frames
/**:
  ros__parameters:
    frame_id_auv: "auv_link"
    frame_id_global: "pool_link" # Inertial frame, located at AUV's deployment point. 
    # Orientation is that of auv_link at deployment time. 
    publish_pose_tf: true

# IMU node parameters
imu_processor:
  ros__parameters:
    frame_id: "imu_link"
    # To hotswap to the ZED camera IMU instead of the hardware IMU, change this to: "/sensors/zed/imu/data"
    # and update q_vs to match the ZED's physical orientation relative to the AUV.
    topic_in: "imu/data"
    # Position offset from sensor to AUV frame (meters)
    offset_xyz: [0.0, 0.0, 0.0] # IMU is mounted at origin of AUV frame
    # Orientation offset as quaternion from sensor to AUV frame. (w,x,y,z)
    q_vs: [1.0, 0.0, 0.0, 0.0]
    
    # DVL Yaw drift correction (Complementary filter)
    use_dvl_yaw_correction: true
    dvl_yaw_interpolation_rate: 0.05

# Depth node parameters
depth_processor:
  ros__parameters:
    frame_id: "depth_link"
    # Position offset from sensor to AUV frame (meters), expressed in AUV frame.
    r_vs_v: [0.0624, 0.0585, 0.0962] # [m] Forward, Left, Up. 


# DVL node parameters 
dvl_processor:
  ros__parameters:
    frame_id: "dvl_link"
    # Position offset from sensor to AUV frame (meters), expressed in AUV frame.
    # Forward, Left, Up.
    r_dv_v: [0.084, -0.0685, -0.122]
  
    #Orientation offset as quaternion from non inertial dvl frame to AUV frame. (w,x,y,z) 
    q_vd: [0.0, 1.0, 0.0, 0.0]
    
    # Orientation offset as quaternion from DVL inertial frame to pool inertial frame. (w,x,y,z)
    q_pi2: [0.0, 1.0, 0.0, 0.0]

# State aggregator node parameters
state_aggregator:
  ros__parameters:
    use_vio_for_position: false
    use_vio_for_orientation: false
    # Must match vision's front_cam_object_detection vio_pose_topic
    vio_pose_topic: "/vision/vio_pose"
