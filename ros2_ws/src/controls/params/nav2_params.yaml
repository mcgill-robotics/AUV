planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0 # Hz
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0 # seconds to wait for costmap to tinish updating before aborting a request
    GridBased:
      plugin: "nav2_theta_star_planner::ThetaStarPlanner"
      how_many_corners: 8 # cardinals + diagonals
      w_euc_cost: 1.0 # weight of euclidean distance cost
      w_traversal_cost: 2.5 # weight of costmap traversal cost

controller_server:
  ros__parameters:
    controller_frequency: 20.0 # Rate in Hz to run the controller
    odom_topic: "/state/odometry"
    min_x_velocity_threshold: 0.01 # Filter to treat anything below as zero
    min_y_velocity_threshold: 0.01 
    min_theta_velocity_threshold: 0.01
    costmap_update_timeout: 0.30 # max seconds to wait for local_costmap before aborting
    failure_tolerance: 0.3 # seconds to wait for finding a valid trajectory before aborting
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # if the auv doesn't move required_movement_radius meters 
      # in movement_time_allowence seconds, it is considered stuck and aborts
      required_movement_radius: 0.15
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: true # once xy goal tolerance is met, it will remain met until the goal is reached
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20 # (meters) goal is reached when within these tolerances
      yaw_goal_tolerance: 0.20 # (radians)

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      
      # Velocity limits, (m/s for linear) (radians/s for angular)
      min_vel_x: -0.5
      max_vel_x: 0.5
      min_vel_y: -0.5
      max_vel_y: 0.5
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.7
      min_speed_theta: 0.0
      
      # Acceleration limits, (m/s^2 for linear) (radians/s^2 for angular)
      acc_lim_x: 0.8
      acc_lim_y: 0.8
      acc_lim_theta: 1.2
      decel_lim_x: -1.0
      decel_lim_y: -1.0
      decel_lim_theta: -1.5

      # ── Deterministic Omni Trajectory Sampling ──
      # Sample 7 velocities in each direction, for a total of 7^3 = 343 trajectories
      vx_samples: 7
      vy_samples: 7
      vtheta_samples: 7
      sim_time: 1.2 # time in seconds to project each trajectory
      linear_granularity: 0.05 # step sizes to discretize each trajectory
      angular_granularity: 0.05 # matches costmap step 0.05m
      transform_tolerance: 0.2 # allowed time for tf transform
      short_circuit_trajectory_evaluation: true # Stop evaluating a trajectory if its cost is worse than the current best trajectory

      # ── Critics ──
      critics: [
        "RotateToGoal", # rotate in place after reaching the xy goal
        "Oscillation", # penalize oscillating trajectories
        "BaseObstacle", # penalize trajectories that collide with obstacles
        "PathAlign", # penalize trajectories that deviate from the path
        "GoalAlign", # penalize trajectories that deviate from the goal
        "PathDist", # penalize trajectories that are too far from the path
        "GoalDist", # penalize trajectories that are too far from the goal
        "Twirling" # penalize trajectories that spin in place while strafing
      ]
      
      # cost coefficients for each critic
      BaseObstacle.scale: 0.04
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      PathAlign.scale: 12.0
      GoalAlign.scale: 12.0
      RotateToGoal.scale: 32.0
      Twirling.scale: 8.0         # Critical for Omni: suppresses spinning while strafing

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0 # Hz
      publish_frequency: 1.0 # Hz
      global_frame: pool_link # 7x7x7 = 343 trajectories (< 2ms compute)
      robot_base_frame: auv_link
      robot_radius: 0.25 # treat the robot as a circle with this radius
      resolution: 0.05 # costmap resolution in meters
      rolling_window: false # whether this costmap moves with the auv (global costmap doesn't)
      track_unknown_space: false  # Unmapped water is treated as free space
      always_send_full_costmap: true
      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: "/map"
        map_subscribe_transient_local: true

      # the cost is infinite on the obstacles and within robot_radius of the obstacles
      # between robot_radius and inflation_radius, the cost decays exponentially to zero
      # cost_scaling_factor controls how fast the cost decays to zero
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.8

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0 # Hz
      publish_frequency: 2.0 # Hz
      global_frame: pool_link
      robot_base_frame: auv_link
      rolling_window: true # whether this costmap moves with the auv (local costmap does)
      track_unknown_space: false  # Unmapped water is treated as free space
      width: 4 # total width in meters of this costmap (2 in each direction)
      height: 4 # total height in meters of this costmap (2 in each direction)
      resolution: 0.05 # costmap resolution in meters
      robot_radius: 0.25 # treat the robot as a circle with this radius
      always_send_full_costmap: true
      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: "/map"
        map_subscribe_transient_local: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.6