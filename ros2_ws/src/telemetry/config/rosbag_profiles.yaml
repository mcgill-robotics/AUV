save_dir: "~/AUV/rosbags"

# Rosbag profiles define lists of topics to record or exclude.
# Each profile can specify 'topics' (to record) and/or 'exclude' (topics to ignore).
# Use regex (e.g., '.*') for patterns.

profiles:
  all:
    topics:
      - ".*"
    # Exclude annotated since they are natively 5Hz and handled by include rules
    # exclude:
    #   - ".*/annotated/compressed$"

  all_no_vision:
    topics:
      - ".*"
    exclude:
      - ".*image.*"
      - ".*pointcloud.*"
      - "/vision/.*"
      - "/zed/.*"

  vision:
    topics:
      - "/zed/.*"
      - "/vision/.*"
      # We now natively publish annotated/depth at 5Hz, so no need to exclude them if we want to record them
      # - ".*/annotated/compressed$" 
      # - ".*/depth/compressed$" 
      
  nav_and_controls:
    topics:
      - "/planner_root_tree/.*"
      - "/imu/.*"
      - "/filter/.*"
      - "/gnss.*"
      - "/odometry"
      - "/pressure"
      - "/temperature"
      - "/rtcm"
      - "/nmea"
      - "/dvl/.*"
      - "/auv_frame/.*"
      - "/auv_state/.*"
      - "/controls/.*"
      - "/propulsion/.*"
