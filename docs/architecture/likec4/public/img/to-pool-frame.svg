ont-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#2f9e44" text-anchor="start">gate at (4, 5)</text><text x="430" y="90" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e1e1e" text-anchor="start">1. The detection says: 3 m ahead of the camera.</text><text x="430" y="125" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e1e1e" text-anchor="start">2. The AUV pose saved with that frame says</text><text x="430" y="141.25" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e1e1e" text-anchor="start">    where the vehicle was and which way it faced.</text><text x="430" y="178" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e1e1e" text-anchor="start">3. TF says where the camera sits on the hull.</text><text x="430" y="213" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e1e1e" text-anchor="start">4. Chain them: pool &lt;- AUV &lt;- camera.</text><text x="430" y="248" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e1e1e" text-anchor="start">The uncertainty is turned the same way,</text><text x="430" y="264.25" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e1e1e" text-anchor="start">so "unsure about distance" stays along</text><text x="430" y="280.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e1e1e" text-anchor="start">the line of sight.</text><text x="430" y="320" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#868e96" text-anchor="start">No pose with the frame, no position.</text><text x="430" y="335" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#868e96" text-anchor="start">That is why the pose travels with the detections.</text></svg>