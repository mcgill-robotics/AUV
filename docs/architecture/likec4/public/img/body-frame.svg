87466027818" stroke="#e8590c" stroke-width="3.2" fill="none"/><text x="180" y="232" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#e8590c" text-anchor="start">push: +x in the pool frame</text><text x="360" y="80" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e1e1e" text-anchor="start">Controller says: push along pool x.</text><text x="360" y="110" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1e1e1e" text-anchor="start">The IMU says the vehicle is turned 60 degrees.</text><text x="360" y="127.5" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1e1e1e" text-anchor="start">In its own frame that same push is</text><text x="360" y="145" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1e1e1e" text-anchor="start">0.5 forward and 0.87 to the right.</text><text x="360" y="200" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1e1e1e" text-anchor="start">superimposer does this turn with</text><text x="360" y="217.5" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1e1e1e" text-anchor="start">the IMU orientation, so the thrusters</text><text x="360" y="235" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1e1e1e" text-anchor="start">get the push in their own frame.</text></svg>