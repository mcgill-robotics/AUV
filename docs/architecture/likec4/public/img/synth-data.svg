 sans-serif" font-size="15" font-weight="bold" fill="#1e1e1e" text-anchor="middle">Train</text><text x="730" y="130" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1e1e1e" text-anchor="middle">RF-DETR, export</text><text x="730" y="143.75" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1e1e1e" text-anchor="middle">to ONNX, TensorRT</text><text x="730" y="157.5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1e1e1e" text-anchor="middle">on the Jetson</text><text x="20" y="230" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e1e1e" text-anchor="start">Each batch changes the ranges: clear or murky water, near or far, front or down camera.</text><text x="20" y="255" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e1e1e" text-anchor="start">The look changes every frame, so the model learns the object, not one pool.</text><text x="20" y="290" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#868e96" text-anchor="start">Then a smaller set of real images, pre-labelled by this model and fixed by people in Roboflow, fine-tunes it.</text></svg>