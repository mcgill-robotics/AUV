<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400"><rect width="100%" height="100%" fill="#ffffff"/><text x="20" y="34" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e1e1e" text-anchor="start">One controller, one axis. Example: depth_controller.</text><path d="M20.39736246969551 59.08377467188984 L270.8871867945418 59.393759326078 L270.1564291110262 370.9896183470264 L19.867229311726987 369.02610637340695" stroke="none" stroke-width="0" fill="#d0ebff"/><path d="M19.417527066083693 60.15762692598713 C69.43283857035341 60.474061366489515, 119.41671213910105 59.989505041307375, 269.39115478082783 59.45681734088261 M20.397163994901153 60.20341387356896 C110.52941540652795 60.606338919159796, 201.27412946790733 60.73518970040655, 270.05456631173627 60.32578382238124 M269.32779483282735 59.37640341027664 C269.69494763888787 152.5647914602159, 269.60755872852224 244.51248944666145, 269.87076073692333 370.4374880257701 M269.6633724844556 60.14774715660068 C269.3207027840042 172.2227576156095, 269.10572750141165 285.05762532592394, 270.32853947777306 369.9957515834736 M270.7748335210971 370.1516968775461 C204.01150691638483 371.12778211864804, 136.53034913799132 370.6215018661626, 19.681415633290733 370.4655225769379 M269.98438121754685 369.8189342041526 C172.57819303839136 370.14267905121557, 74.55141695912275 369.89160720636175, 19.984543245050553 370.29045783521013 M19.910324992239403 369.71874038820323 C20.138602107452947 283.80454953122006, 19.61855828669836 198.6929537419687, 19.30508980188726 59.81963489996366 M19.894393530793867 370.3474889507575 C19.781414471187745 251.26817382954056, 19.280824455099527 132.1513689340554, 19.81818828651481 60.28540035640734" stroke="#1971c2" stroke-width="1.6" fill="none"/><path d="M8.770869514103374 60.33262328401476 C62.78349662159971 61.09597434864812, 116.7297836080126 60.07346683501834, 278.7152188943007 58.853779588962816 M10.838092803302072 60.42924259428999 C107.54911815976136 61.393370593514845, 205.55255809971464 61.66527064953485, 280.11514546574216 60.68746684109146" stroke="#1971c2" stroke-width="2.5" fill="none"/><text x="150" y="52" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1971c2" text-anchor="start">surface</text><line x1="30" y1="250" x2="260" y2="250" stroke="#2f9e44" stroke-width="1.5" stroke-dasharray="6 5"/><text x="36" y="268" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#2f9e44" text-anchor="start">target: depth 1.0 m (z = -1.0)</text><path d="M90.04781971368939 143.30539950039238 L180.33928344044836 145.75095388200134 L200.09483808670194 159.12928318884224 L178.42880860362203 174.8201054384932 L91.90962150488049 174.33966208603232" stroke="none" stroke-width="0" fill="#ffec99"/><path d="M88.43082647230476 145.42464462313802 C106.42748174332083 145.30059480465016, 124.33944367785007 143.99520718253217, 178.35977992322296 143.5366738954559 M91.06995396809653 145.54799398733303 C122.0861570819281 145.47040360833518, 154.752325577382 145.81752572025172, 180.14700084226206 145.87765683187172 M177.9363693645224 143.0855948606506 C183.93009461105333 150.49311994905955, 189.01752148639875 154.06759423171542, 197.6032430043444 161.34306270871312 M178.96657317178324 145.45357514871284 C186.54810095076914 149.76571430671402, 192.41724034362937 156.4015757928174, 199.00859702425078 159.9869576091878 M200.0873901238665 160.40866915974766 C194.94570103519132 164.94869282746876, 187.7977166454168 167.58126277093032, 179.14173839595168 176.25411098394542 M197.9579232295044 159.51221140576527 C191.52251971138176 166.38038911045902, 183.42025910222438 171.56171390525438, 179.95835972921924 175.7824891413562 M179.72470295932143 174.1365494051948 C156.7580821171403 173.7455125427339, 130.34332189355047 174.89216139675116, 87.86666624452918 174.44628966841847 M179.67579430239275 176.0667708004825 C146.33092006696387 176.53333564133382, 110.23174790749326 176.32282177836635, 89.44184864955022 175.87616243911907 M88.6662705173716 175.3441440442577 C92.47951472173445 164.51581707671284, 88.15978837977163 152.81347678061576, 90.04032513406128 146.73454627189784 M90.53996483283117 174.0424455936067 C89.90998384463602 164.74841621788218, 89.24767136978917 154.73145545711742, 90.54573675887659 145.45908773196862" stroke="#1e1e1e" stroke-width="1.6" fill="none"/><text x="36" y="135" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e1e1e" text-anchor="start">now: depth 0.6 m (z = -0.6)</text><path d="M143.43082647230477 180.42464462313802 C143.34873164234682 191.75588805507869, 143.25381532846018 202.45508593190462, 143.35977992322296 238.5366738954559 M146.0699539680965 180.54799398733303 C144.4963994951546 201.5951094946824, 144.49417346134783 223.72116129277273, 145.14700084226206 240.87765683187172" stroke="#e8590c" stroke-width="2.4" fill="none"/><path d="M144.05849588338285 240.2547867738828 C145.10962164588472 237.72073911435487, 146.09698804621914 234.77560769559025, 149.23545436326853 228.31663910904143 M145.6419723808579 240.32879639239982 C146.53111260686387 236.00549503338956, 148.42439374324331 232.29161347488792, 150.307786914692 229.7212288708909" stroke="#e8590c" stroke-width="2.4" fill="none"/><path d="M144.05849588338285 240.2547867738828 C143.0209892685519 237.65702626201923, 141.91972329155348 234.7118948432546, 138.796281544599 228.31663910904143 M145.6419723808579 240.32879639239982 C142.74187909353685 235.92961108551762, 140.84592671658928 232.21572952701598, 139.86861409602247 229.7212288708909" stroke="#e8590c" stroke-width="2.4" fill="none"/><text x="152" y="215" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#e8590c" text-anchor="start">error -0.4 m</text><text x="36" y="340" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e1e1e" text-anchor="start">The math uses z (up is +),</text><text x="36" y="355" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1e1e1e" text-anchor="start">so the error is -1.0 - (-0.6).</text><text x="300" y="80" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e1e1e" text-anchor="start">effort = P + I + D + feed-forward</text><text x="300" y="115" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e1e1e" text-anchor="start">P   30 x error = 30 x -0.4 = -12 N. Push down, harder when further away.</text><text x="300" y="150" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e1e1e" text-anchor="start">D   -50 x how fast z is changing (smoothed). Brakes as it closes in,</text><text x="300" y="166.25" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e1e1e" text-anchor="start">     so it does not overshoot.</text><text x="300" y="203" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e1e1e" text-anchor="start">I    0.15 x error added up over time. Fixes a small steady miss.</text><text x="300" y="219.25" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e1e1e" text-anchor="start">     Only counts within 0.3 m of the target, and resets when the target changes.</text><text x="300" y="256" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e1e1e" text-anchor="start">FF  -3.5 N, always. The vehicle floats up with 3.5 N (net_buoyancy),</text><text x="300" y="272.25" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1e1e1e" text-anchor="start">     so this cancels it before the PID even starts.</text><text x="300" y="312" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e1e1e" text-anchor="start">Out: /controls/depth_effort, a force in the pool frame, 10 times a second.</text><text x="300" y="340" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#868e96" text-anchor="start">x and y work the same way with the DVL (KP 10, KD 7.5, KI 0.5).</text><text x="300" y="356.25" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#868e96" text-anchor="start">attitude_controller does it on orientation, 25 times a second.</text></svg>